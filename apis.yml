aid: tabs-platform
url: https://raw.githubusercontent.com/api-evangelist/tabs-platform/refs/heads/main/apis.yml
name: Tabs
kind: company
description: >-
  Tabs (tabs.inc) is an AI-native revenue automation platform for B2B companies
  that unifies billing, collections, ASC 606 revenue recognition, and reporting
  on top of a contract-driven data model. Tabs ingests executed contracts, uses
  AI to extract commercial terms, automatically generates invoices, schedules
  ASC 606-compliant revenue, drives collections, and produces real-time ARR,
  cash, and AR reporting. The public Tabs Platform REST API
  (https://api.tabsplatform.com, documented at docs.tabsplatform.com) exposes
  the core data model - customers, contracts, items, revenue categories,
  obligations, invoices, payments, usage events, and performance obligations -
  so contract, billing, and revenue data can flow into the rest of the finance
  stack (ERP, CRM, payment, and tax systems). Supports subscription,
  usage-based, metered, and hybrid billing models. Authenticated with an API
  key passed in the Authorization header.
