meters:
- name: platform_subscription
  description: Monthly platform subscription priced by annual-revenue tier and active-contract volume.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - tier
- name: active_contracts
  description: Count of active contracts managed in Tabs, a factor in tier placement.
  unit: contracts
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track your Tabs tier and active-contract count, which together determine subscription cost.
- name: Allocation
  description: Attribute the Tabs subscription to the finance/revenue function it serves; API usage is included, not separately metered.
- name: Optimization
  description: Right-size the tier to actual revenue and contract volume; consolidate billing workflows into Tabs to replace point tools.
- name: Accountability
  description: Assign an owner in finance to review the subscription tier at renewal against revenue growth and contract volume.
