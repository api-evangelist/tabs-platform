description: >-
  FinOps view of Tabs spend. Tabs is a SaaS revenue automation platform billed
  as a monthly/annual subscription priced by company size (annual revenue) and
  active-contract volume, not by API call. The Tabs Platform API is included
  with the subscription, so API usage does not generate a separate metered
  charge. The dominant cost driver is the platform tier your company qualifies
  for; enterprise agreements are negotiated on volume, integrations, and
  support.
notes: >-
  Because Tabs prices by revenue tier rather than by usage, cost predictability
  is high but cost is not directly attributable to individual API workloads.
  Verify tier boundaries and amounts with Tabs sales; this record is not
  reconciled against a live invoice.
